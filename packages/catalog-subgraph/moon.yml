language: "typescript"
layer: "library"
stack: "backend"

project:
  title: "Agris Catalog Subgraph"
  description: "Owns the Federation Item entity, localized catalog resolution and item-name search."

toolchains:
  default: ["javascript", "node", "pnpm"]

# Inputs stay inside this project so it works unchanged when the repository is mounted inside another workspace.
# Upstream packages reach this project's hashes through `^:` dependencies.
tasks:
  typecheck:
    description: "Type-check the agris catalog subgraph package."
    command: "tsc"
    args: ["-p", "tsconfig.json", "--noEmit"]
    deps: ["^:typecheck"]
    inputs: ["src/**/*.ts", "package.json", "tsconfig.json"]

  build:
    description: "Compile the agris catalog subgraph package for the Node tools that run its output."
    command: "tsc"
    args: ["-p", "tsconfig.json"]
    deps: ["^:build"]
    inputs: ["src/**/*.ts", "package.json", "tsconfig.json"]
    outputs: ["dist/**/*"]
